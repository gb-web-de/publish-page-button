name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (z. B. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: composer cs:check
      - run: composer phpstan
      - run: composer test:unit
      - run: typo3DatabaseDriver=pdo_sqlite composer test:functional

  build-and-release:
    name: Build & Publish Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Tag Version
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "${TAG}" == refs/* ]] || [[ -z "${TAG}" ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.1.0' }}"
          fi
          VERSION="${TAG#v}"
          ZIP_NAME="publish_page_button_${VERSION}.zip"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package Extension Archive (TER compliant)
        run: |
          ZIP_NAME="${{ steps.vars.outputs.zip_name }}"
          echo "Building ${ZIP_NAME} via git archive (top-level contents, respecting .gitattributes)..."
          git archive -o "${ZIP_NAME}" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.vars.outputs.tag }}"
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: "${{ steps.vars.outputs.zip_name }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.tag, '-') }}

      - name: Setup PHP for TER Upload
        if: env.TYPO3_API_TOKEN != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: zip
          tools: composer:v2
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}

      - name: Publish to TYPO3 Extension Repository (TER)
        if: env.TYPO3_API_TOKEN != ''
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
          TYPO3_API_USERNAME: ${{ secrets.TYPO3_API_USERNAME }}
        run: |
          composer global require typo3/tailor:2.1.0 --no-progress --no-interaction
          # Remove all development-only directories and files before Tailor packages the extension
          rm -rf .Build .cache .ddev .github .idea Build Tests config var skills node_modules \
                 package.json package-lock.json playwright.config.ts test-results playwright-report \
                 .php-cs-fixer.cache .phpunit.cache
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish "${{ steps.vars.outputs.version }}" publish_page_button \
            --comment="Release ${{ steps.vars.outputs.tag }}"

      - name: Trigger Packagist Update
        if: env.PACKAGIST_TOKEN != '' && env.PACKAGIST_USERNAME != ''
        continue-on-error: true
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
        run: |
          HTTP_RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/gb-web-de/publish-page-button"}}')
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          echo "Packagist HTTP status: ${HTTP_STATUS}"
          echo "Packagist response: ${HTTP_BODY}"
          if [[ "${HTTP_STATUS}" -eq 200 || "${HTTP_STATUS}" -eq 202 ]]; then
            echo "Packagist package update successfully triggered."
          elif [[ "${HTTP_STATUS}" -eq 404 ]]; then
            echo "::warning::Package not found on Packagist. Please submit https://github.com/gb-web-de/publish-page-button once at https://packagist.org/packages/submit"
          else
            echo "::warning::Packagist API update returned HTTP ${HTTP_STATUS}: ${HTTP_BODY}"
          fi
